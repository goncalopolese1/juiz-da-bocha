<!doctype html><html lang='pt-BR'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Juiz da Bocha</title><style>body{background:#122b23;color:white;font:18px system-ui;padding:20px;max-width:650px;margin:auto}button,label{display:block;background:#d6f5b2;color:#183323;border:0;border-radius:12px;padding:16px;margin:14px 0;font-weight:bold}canvas{width:100%;border-radius:12px}input{display:none}</style><h1>Juiz da Bocha</h1><p>Centralize o balim e fotografe com as bochas visíveis.</p><label>Fotografar<input id='photo' type='file' accept='image/*' capture='environment'></label><label>Escolher da galeria<input id='gallery' type='file' accept='image/*'></label><canvas id='canvas'></canvas><button id='go'>Identificar automaticamente</button><p id='result'>Aguardando foto.</p><p><small>Protótipo experimental: não utilizar como arbitragem definitiva.</small></p><script async src='https://docs.opencv.org/4.x/opencv.js'></script><script>const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),result=document.querySelector('#result');let img=null;function load(e){let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f),i=new Image();i.onload=()=>{img=i;let s=Math.min(1,900/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;ctx.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);result.textContent='Foto carregada.'};i.src=u}photo.onchange=load;gallery.onchange=load;document.querySelector('#go').onclick=()=>{if(!img){result.textContent='Fotografe primeiro.';return}if(!window.cv||!cv.Mat){result.textContent='Carregando OpenCV. Aguarde e tente novamente.';return}let a,b,d,h;try{ctx.drawImage(img,0,0,c.width,c.height);a=cv.imread(c);b=new cv.Mat();d=new cv.Mat();h=new cv.Mat();cv.cvtColor(a,b,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(b,d,new cv.Size(9,9),2);let m=Math.min(c.width,c.height);cv.HoughCircles(d,h,cv.HOUGH_GRADIENT,1,Math.max(18,m*.07),100,32,Math.max(3,Math.round(m*.007)),Math.round(m*.19));let v=[];for(let j=0;j<h.cols;j++)v.push({x:h.data32F[j*3],y:h.data32F[j*3+1],r:h.data32F[j*3+2]});if(v.length<3){result.textContent='Inconclusivo: círculos insuficientes.';return}let t=v.reduce((p,q)=>Math.hypot(q.x-c.width/2,q.y-c.height/2)<Math.hypot(p.x-c.width/2,p.y-c.height/2)?q:p);let balls=v.filter(q=>q!==t&&q.r>t.r*1.25).map(q=>({...q,dist:Math.hypot(q.x-t.x,q.y-t.y)-q.r-t.r})).sort((x,y)=>x.dist-y.dist);if(balls.length<2){result.textContent='Inconclusivo: bochas não identificadas.';return}for(let q of v){ctx.strokeStyle=q===t?'yellow':'white';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.stroke()}let w=balls[0];ctx.strokeStyle='#65ff9b';ctx.lineWidth=6;ctx.beginPath();ctx.arc(w.x,w.y,w.r+5,0,Math.PI*2);ctx.stroke();result.textContent=balls[1].dist-w.dist<Math.max(8,w.r*.12)?'Inconclusivo: diferença muito pequena.':'A bocha destacada em verde parece a mais próxima. Confira as marcações automáticas.'}catch(e){result.textContent='Erro na análise: '+e.message}finally{for(let x of [a,b,d,h])if(x)x.delete()}};</script></html>
