<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizar Juiz da Bocha</title><style>body{font:18px system-ui;background:#10271f;color:white;text-align:center;padding:50px 20px}a{color:#d4f5aa}</style></head><body><h2>Atualizando Juiz da Bocha</h2><p id="msg">Limpando versões antigas...</p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/juiz-da-bocha/')).map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('juiz-da-bocha-')).map(k=>caches.delete(k)))}}catch(e){document.getElementById('msg').textContent='Continuando atualização...'}location.replace('./index.html?reinstalacao=410'+Date.now())})();</script><p><a href="./index.html?manual=41">Abrir manualmente</a></p></body></html>
